[package]
name = "snarta"
version = "0.1.0"
edition = "2024"
description = "Windows desktop companion for local LLM on llama.cpp"
license = "MIT"

[[bin]]
name = "snarta"
path = "src/main.rs"

[dependencies]
gpui-component = "0.9.0"
gpui-kit = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
toml = "1.1.8"
ureq = { version = "3.5.0", default-features = false, features = ["rustls", "json"] }
zip = { version = "9.1.0", default-features = false, features = ["deflate"] }
globset = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_JobObjects",
    "Win32_System_Memory",
    "Win32_System_Performance",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1
